name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    name: Functions (Deno test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Deno tests
        working-directory: supabase/functions/stellar-send
        run: deno test
